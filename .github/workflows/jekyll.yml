# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Ruby
        # Updated from the official v1 branch; pin for reproducible builds.
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a
        with:
          ruby-version: '3.2'
          bundler: '4.0.5'
      - name: Install dependencies
        shell: bash
        env:
          BUNDLE_FROZEN: 'true'
          BUNDLE_PATH: vendor/bundle
          BUNDLE_RETRY: '3'
          BUNDLE_TIMEOUT: '60'
        run: |
          bundle config set --local path vendor/bundle
          if ! bundle install --jobs 4 2>&1 | tee /tmp/bundle-install.log; then
            details=$(tail -n 20 /tmp/bundle-install.log)
            details="${details//'%'/'%25'}"
            details="${details//$'\n'/'%0A'}"
            details="${details//$'\r'/'%0D'}"
            echo "::error title=Dependency installation failed::$details"
            exit 1
          fi
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
